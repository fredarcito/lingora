name: Windows build

on:
  push:
    branches: [windows-build]
  workflow_dispatch:

# llama-cpp-sys-2 compila llama.cpp con /MT solo si esta variable vale 1; si no, usa /MD
# y no casa con sherpa-onnx (/MT) al enlazar.
env:
  LLAMA_STATIC_CRT: "1"

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # prefix-key nuevo: la caché anterior tenía llama.cpp configurado con /MD.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: "crt-mt"

      # Mismo espeak-ng (versión y SHA-256) que scripts/build-espeak.sh, compilado
      # con MSVC. Solo el programa: los datos ya están en src-tauri/resources.
      - name: espeak-ng para Windows
        shell: bash
        run: |
          VERSION=1.52.0
          SHA256=bb4338102ff3b49a81423da8a1a158b420124b055b60fa76cfb4b18677130a23
          # Ruta relativa: las herramientas de Windows no entienden /d/... ni D:\... de Git Bash.
          WORK="espeak-build"
          mkdir -p "$WORK"
          curl -fsSL -o "$WORK/espeak.tar.gz" "https://github.com/espeak-ng/espeak-ng/archive/refs/tags/$VERSION.tar.gz"
          echo "$SHA256  $WORK/espeak.tar.gz" | sha256sum -c -
          # --force-local: el tar de Git Bash tomaría «D:» de la ruta por un equipo remoto.
          tar --force-local -xzf "$WORK/espeak.tar.gz" -C "$WORK"
          cmake -S "$WORK/espeak-ng-$VERSION" -B "$WORK/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DUSE_MBROLA=OFF -DUSE_LIBSONIC=OFF -DUSE_LIBPCAUDIO=OFF \
            -DUSE_ASYNC=OFF -DUSE_KLATT=OFF -DUSE_SPEECHPLAYER=OFF
          cmake --build "$WORK/build" --config Release
          EXE=$(find "$WORK/build" -name espeak-ng.exe | head -n 1)
          mkdir -p src-tauri/binaries
          cp "$EXE" src-tauri/binaries/espeak-ng-x86_64-pc-windows-msvc.exe
          "$EXE" --path="$WORK/build" -v es -q --ipa "Hola, esto es una prueba."

      # Las DLL de sherpa-onnx que Tauri empaqueta (tauri.windows.conf.json) deben existir ya.
      - name: sherpa-onnx (DLL)
        shell: bash
        run: bash scripts/fetch-sherpa.sh

      - name: cargo check (Windows)
        working-directory: src-tauri
        env:
          # El enlazador busca sherpa-onnx-c-api.lib aquí, no en la caché del crate.
          SHERPA_ONNX_LIB_DIR: ${{ github.workspace }}/src-tauri/sherpa-libs
        run: cargo check --target x86_64-pc-windows-msvc

  # A prueba: la traducción por la GPU (Cargo.toml, opción `vulkan`). Va aparte para
  # que, si falla, el instalador (CPU) salga igual.
  vulkan:
    runs-on: windows-latest
    env:
      # Carpeta corta: dentro de target/, la prueba del compilador de vulkan-shaders-gen
      # pasa de 260 caracteres y cl.exe falla con C1041 (no puede abrir el .pdb; lo de
      # /FS del mensaje es engañoso).
      CARGO_TARGET_DIR: C:\t
      # Con MSBuild, instalar vulkan-shaders-gen falla («Not a file: cmake_install.cmake»
      # aunque el archivo existe; igual con VS 2022 y CMake 3). Con Ninja no hay MSBuild.
      # Ojo: Ninja cambia /MT por /MD; cargo check no enlaza, el instalador sí.
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: "vulkan"

      # Ninja no prepara el compilador como MSBuild: cl.exe tiene que estar en el PATH.
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: SDK de Vulkan
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: false
          cache: true

      # ggml-vulkan busca SPIRV-Headers con find_package y el SDK no trae su
      # configuración de CMake: se instalan las de la misma versión del SDK.
      - name: SPIRV-Headers
        shell: bash
        run: |
          git clone --depth 1 --branch vulkan-sdk-1.4.309.0 https://github.com/KhronosGroup/SPIRV-Headers.git spirv-headers
          cmake -S spirv-headers -B spirv-headers/build -DSPIRV_HEADERS_ENABLE_TESTS=OFF
          cmake --install spirv-headers/build --prefix spirv-headers-install
          echo "CMAKE_PREFIX_PATH=$(cygpath -w "$PWD/spirv-headers-install")" >> "$GITHUB_ENV"

      - name: sherpa-onnx (DLL)
        shell: bash
        run: bash scripts/fetch-sherpa.sh

      # cargo check solo pide que espeak-ng exista (tauri-build); no se ejecuta.
      - name: espeak-ng (vacío)
        shell: bash
        run: mkdir -p src-tauri/binaries && touch src-tauri/binaries/espeak-ng-x86_64-pc-windows-msvc.exe

      # La salida se guarda en build.log: si falla, el paso siguiente saca solo los errores
      # (en la página del trabajo quedan enterrados bajo miles de líneas). Con cmd y no
      # Git Bash: su /usr/bin/link taparía el link.exe de Visual Studio.
      - name: cargo check (Windows, Vulkan)
        working-directory: src-tauri
        shell: cmd
        env:
          SHERPA_ONNX_LIB_DIR: ${{ github.workspace }}/src-tauri/sherpa-libs
        run: cargo check --target x86_64-pc-windows-msvc --features vulkan > build.log 2>&1

      - name: Errores de la compilación
        if: failure()
        working-directory: src-tauri
        shell: bash
        run: |
          grep -n -i -E "error C[0-9]+|error LNK|FAILED:|CMake Error|fatal error|: error" build.log | grep -v "rerun-if" | head -40 || true
          echo "---- final de la salida de CMake ----"
          grep -v "rerun-if" build.log | tail -60
          echo "---- versiones y carpeta de vulkan-shaders-gen ----"
          cmake --version | head -1
          ls -la /c/t/x86_64-pc-windows-msvc/debug/build/llama-cpp-sys-2-*/out/build/ggml/src/ggml-vulkan/vulkan-shaders-gen-prefix/src/vulkan-shaders-gen-build/ || true

  installer:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 12

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: "crt-mt"

      - name: espeak-ng para Windows
        shell: bash
        run: |
          VERSION=1.52.0
          SHA256=bb4338102ff3b49a81423da8a1a158b420124b055b60fa76cfb4b18677130a23
          WORK="espeak-build"
          mkdir -p "$WORK"
          curl -fsSL -o "$WORK/espeak.tar.gz" "https://github.com/espeak-ng/espeak-ng/archive/refs/tags/$VERSION.tar.gz"
          echo "$SHA256  $WORK/espeak.tar.gz" | sha256sum -c -
          tar --force-local -xzf "$WORK/espeak.tar.gz" -C "$WORK"
          cmake -S "$WORK/espeak-ng-$VERSION" -B "$WORK/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DUSE_MBROLA=OFF -DUSE_LIBSONIC=OFF -DUSE_LIBPCAUDIO=OFF \
            -DUSE_ASYNC=OFF -DUSE_KLATT=OFF -DUSE_SPEECHPLAYER=OFF
          cmake --build "$WORK/build" --config Release
          EXE=$(find "$WORK/build" -name espeak-ng.exe | head -n 1)
          mkdir -p src-tauri/binaries
          cp "$EXE" src-tauri/binaries/espeak-ng-x86_64-pc-windows-msvc.exe

      - name: sherpa-onnx (DLL)
        shell: bash
        run: bash scripts/fetch-sherpa.sh

      # Instalador NSIS sin firmar (demo). El destino se pide aquí y no en
      # tauri.conf.json, para no tocar la configuración de macOS.
      - name: Instalador .exe
        env:
          SHERPA_ONNX_LIB_DIR: ${{ github.workspace }}/src-tauri/sherpa-libs
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - uses: actions/upload-artifact@v6
        with:
          name: lingora-windows-installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  # El instalador con la traducción por la GPU (Vulkan), aparte del de CPU para
  # comparar los dos en el mismo equipo. Mismo arreglo que el trabajo `vulkan`.
  installer-vulkan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 12

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: "vulkan-installer"

      - name: espeak-ng para Windows
        shell: bash
        run: |
          VERSION=1.52.0
          SHA256=bb4338102ff3b49a81423da8a1a158b420124b055b60fa76cfb4b18677130a23
          WORK="espeak-build"
          mkdir -p "$WORK"
          curl -fsSL -o "$WORK/espeak.tar.gz" "https://github.com/espeak-ng/espeak-ng/archive/refs/tags/$VERSION.tar.gz"
          echo "$SHA256  $WORK/espeak.tar.gz" | sha256sum -c -
          tar --force-local -xzf "$WORK/espeak.tar.gz" -C "$WORK"
          cmake -S "$WORK/espeak-ng-$VERSION" -B "$WORK/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DUSE_MBROLA=OFF -DUSE_LIBSONIC=OFF -DUSE_LIBPCAUDIO=OFF \
            -DUSE_ASYNC=OFF -DUSE_KLATT=OFF -DUSE_SPEECHPLAYER=OFF
          cmake --build "$WORK/build" --config Release
          EXE=$(find "$WORK/build" -name espeak-ng.exe | head -n 1)
          mkdir -p src-tauri/binaries
          cp "$EXE" src-tauri/binaries/espeak-ng-x86_64-pc-windows-msvc.exe

      - name: SDK de Vulkan
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: false
          cache: true

      - name: SPIRV-Headers
        shell: bash
        run: |
          git clone --depth 1 --branch vulkan-sdk-1.4.309.0 https://github.com/KhronosGroup/SPIRV-Headers.git spirv-headers
          cmake -S spirv-headers -B spirv-headers/build -DSPIRV_HEADERS_ENABLE_TESTS=OFF
          cmake --install spirv-headers/build --prefix spirv-headers-install
          echo "CMAKE_PREFIX_PATH=$(cygpath -w "$PWD/spirv-headers-install")" >> "$GITHUB_ENV"

      - name: sherpa-onnx (DLL)
        shell: bash
        run: bash scripts/fetch-sherpa.sh

      # Después de los pasos con Git Bash: deja cl.exe en el PATH para Ninja.
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      # Ninja, la carpeta corta y /MT solo en este paso, para no tocar espeak-ng.
      - name: Instalador .exe (Vulkan)
        shell: cmd
        env:
          SHERPA_ONNX_LIB_DIR: ${{ github.workspace }}/src-tauri/sherpa-libs
          CARGO_TARGET_DIR: C:\t
          CMAKE_GENERATOR: Ninja
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}\.github\cmake\msvc-static-crt.cmake
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --features vulkan > build.log 2>&1

      - name: Errores de la compilación
        if: failure()
        shell: bash
        run: |
          grep -n -i -E "error C[0-9]+|error LNK|FAILED:|CMake Error|fatal error|: error" build.log | grep -v "rerun-if" | head -40 || true
          echo "---- final de la salida ----"
          grep -v "rerun-if" build.log | tail -60

      - uses: actions/upload-artifact@v6
        with:
          name: lingora-windows-installer-vulkan
          path: C:/t/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
