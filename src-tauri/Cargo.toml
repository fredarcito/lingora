[package]
name = "lingora"
version = "0.1.0"
description = "Traductor bidireccional para videollamadas"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lingora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
dotenvy = "0.15"
thiserror = "2"
hound = "3.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cpal = "0.15"
# Librerías de sherpa-onnx como archivos aparte (dylib / dll), no estáticas: así
# Windows y Mac usan el mismo enlazado. Mac las empaqueta en el .app (ver
# tauri.conf.json); Windows, junto al .exe (ver tauri.windows.conf.json).
sherpa-onnx = { version = "2.0.1", default-features = false, features = ["shared"] }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"
core-foundation = "0.10"
# Traducción local dentro de la app (sin `llama-server` aparte). Sin las
# opciones por defecto: `openmp` pediría libomp de Homebrew.
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["metal"] }
# Clave de Groq para los resúmenes: se guarda en el llavero, nunca en un archivo.
keyring = { version = "3", features = ["apple-native"] }

# Windows (prueba de compilación): CPU por ahora; `vulkan` se añade después.
[target.'cfg(windows)'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false }
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Variant", "Win32_System_Com_StructuredStorage", "Win32_Security", "Win32_Media_Multimedia"] }
windows-core = "0.61.2"
# Windows no trae bzip2: el tar de Windows no puede descomprimir .tar.bz2 (models.rs).
bzip2 = "0.6.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
